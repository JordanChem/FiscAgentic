[pytest]
testpaths = tests
# deepeval installe un plugin pytest qui importe tout son runtime au démarrage
# (~2 min). Les tests unitaires n'en ont pas besoin ; l'évaluation se lance via
# `python -m eval.run_eval`, pas via pytest.
addopts = -p no:deepeval -q
filterwarnings =
    ignore::DeprecationWarning
